<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>CORTEX Health AI · Talk to us</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --surface:#0a0a0f; --border:#2c2e38; --text:#f8f9fc; --muted:#8a8f9e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
  .card { max-width:520px; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 24px; text-align:center; }
  h1 { font-size:24px; margin:0 0 12px; font-weight:600; }
  p { color:var(--muted); line-height:1.6; margin:0 0 24px; }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a.btn { display:inline-block; padding:12px 20px; border-radius:999px; text-decoration:none; font-weight:600; font-size:14px; border:1px solid var(--border); color:var(--text); }
  a.btn.primary { background:var(--text); color:var(--bg); border-color:var(--text); }
  .home { display:inline-block; margin-top:20px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
  <main class="card">
    <h1>Online checkout is paused</h1>
    <p>We set up every practice with a short call first. Book a time and we will walk through what your practice needs.</p>
    <div class="row">
      <a class="btn primary" href="https://innovativeblockchainsolutions.live/#cta-section">Book a call</a>
      <a class="btn" href="mailto:support@innovativeblockchainsolutions.live?subject=CORTEX%20Health%20AI%20Practice%20build">Email us</a>
    </div>
    <a class="home" href="/">Back to CORTEX Health AI</a>
  </main>
</body>
</html>
